# .repo-sync.yaml — repo-sync configuration for ha-sugar-valley-neopool

template:
  owner: alexdelprete
  repo: ha-integration-template
  branch: main

vars:
  # ── Identity ──
  repo_name: ha-sugar-valley-neopool
  integration_name: Sugar Valley NeoPool
  component_dir: sugar_valley_neopool
  domain: sugar_valley_neopool
  default_branch: main

  # ── 4noks workaround ──
  needs_symlink: false
  python_import_name: ""

  # ── HA/HACS ──
  ha_min_version: "2026.3.0"
  hide_default_branch: false
  ignore_brands: false

  # ── Workflow tuning ──
  jsonlint_flags: ""

  # ── Dependabot ──
  dependabot_interval: weekly
  dependabot_time: ""
  dependabot_timezone: ""

  # ── Pyproject tools tuning ──
  include_mypy: false
  ruff_extend_exclude: []
  ruff_lint_extra_ignores: []
  ruff_lint_extra_perfile_ignores: {}
  ruff_tests_extra_ignores: []

  # ── Extras ──
  requirements_extra_deps: []
  gitignore_extra: []
  bug_extra_fields:
    - type: input
      id: tasmota_version
      label: Tasmota Firmware Version
      placeholder: "14.3.0"
      required: false
  config_extra_links:
    - name: Tasmota NeoPool Documentation
      url: https://tasmota.github.io/docs/NeoPool/
      about: Official Tasmota NeoPool documentation

copy_files:
  - .gitattributes
  - .pymarkdownlint.json
  - .python-version
  - Dockerfile.dev
  - .github/workflows/dbautomerge.yml
  - .github/FUNDING.yml
  - LICENSE

template_files:
  - .github/workflows/lint.yml
  - .github/workflows/test.yml
  - .github/workflows/validate.yml
  - .github/workflows/release.yml
  - .github/dependabot.yml
  - .github/ISSUE_TEMPLATE/bug.yml
  - .github/ISSUE_TEMPLATE/feature_request.yml
  - .github/ISSUE_TEMPLATE/config.yml
  - .pre-commit-config.yaml
  - hacs.json
  - .gitignore
  - requirements-dev.txt
  - .devcontainer.json
  - docs/releases/README.md

marker_files:
  CLAUDE.md:
    - template: CLAUDE_SHARED.md.j2
      begin: "<!-- BEGIN SHARED:repo-sync -->"
      end: "<!-- END SHARED:repo-sync -->"
  README.md:
    - template: README_BADGES.md.j2
      begin: "<!-- BEGIN SHARED:repo-sync:badges -->"
      end: "<!-- END SHARED:repo-sync:badges -->"
    - template: README_INSTALLATION.md.j2
      begin: "<!-- BEGIN SHARED:repo-sync:installation -->"
      end: "<!-- END SHARED:repo-sync:installation -->"
    - template: README_CONTRIBUTING.md.j2
      begin: "<!-- BEGIN SHARED:repo-sync:contributing -->"
      end: "<!-- END SHARED:repo-sync:contributing -->"
    - template: README_LICENSE.md.j2
      begin: "<!-- BEGIN SHARED:repo-sync:license -->"
      end: "<!-- END SHARED:repo-sync:license -->"
  pyproject.toml:
    - template: PYPROJECT_TOOLS.toml.j2
      begin: "# <!-- BEGIN SHARED:repo-sync -->"
      end: "# <!-- END SHARED:repo-sync -->"
