# yamllint disable
#
# Sugar Valley NeoPool — full-width Lovelace dashboard
#
# This file is a Lovelace view fragment (pasted under `views:` in a
# dashboard), not a standalone YAML document — yamllint is disabled for
# the whole file because the top-level indentation is intentional.
#
# Companion to the alexdelprete/ha-sugar-valley-neopool custom integration.
# See lovelace/README.md in this repo for installation notes, custom-card
# dependencies, and the device-name caveat.
#
# Entity IDs below assume the default device name `NeoPool` (slug `neopool`).
# If you set a different device name in the config flow, find/replace
# `neopool_` with your slug throughout this file.
#
# Migrated from the YAML package? Your entity IDs are still `neopool_mqtt_*`
# — use `ha_neopool_lovelace_migrated.yaml` (same folder) instead.

  - icon: mdi:pool
    type: custom:masonry-layout
    layout:
      width: 400
    badges: []
    cards:
      - type: custom:stack-in-card
        cards:
          - type: custom:text-divider-row
            text: Sugar Valley NeoPool
          - type: grid
            square: false
            columns: 3
            cards:
              - type: custom:mushroom-entity-card
                entity: sensor.neopool_water_temperature
                primary_info: state
                secondary_info: name
                name: Temperature
                icon_color: blue
              - type: custom:mushroom-entity-card
                entity: sensor.neopool_ph
                primary_info: state
                secondary_info: name
                name: pH
                icon_color: green
              - type: custom:mushroom-entity-card
                entity: sensor.neopool_redox_orp
                primary_info: state
                secondary_info: name
                name: Redox
                icon_color: cyan
          - type: custom:mini-graph-card
            entities:
              - entity: sensor.neopool_water_temperature
                name: Temperature
                color: var(--blue-color)
              - entity: sensor.neopool_ph
                name: pH
                color: var(--green-color)
                y_axis: secondary
            hours_to_show: 24
            line_width: 3
            font_size: 50
            animate: true
            show:
              name: false
              icon: false
              state: false
              legend: false
              fill: fade
          - type: custom:mini-graph-card
            entities:
              - entity: sensor.neopool_redox_orp
                name: Redox
                color: var(--cyan-color)
            hours_to_show: 24
            line_width: 3
            font_size: 50
            animate: true
            show:
              name: false
              icon: false
              state: false
              legend: false
              fill: fade
          - type: custom:text-divider-row
            text: Main Controls
          - type: grid
            columns: 3
            square: false
            cards:
              - type: custom:mushroom-entity-card
                entity: switch.neopool_filtration
                icon: phu:pool-filter
                name: Filtration
                tap_action:
                  action: toggle
                hold_action:
                  action: more-info
                double_tap_action:
                  action: none
              - type: custom:mushroom-entity-card
                entity: light.neopool_light
                icon: mdi:light-recessed
                name: Light
                tap_action:
                  action: toggle
                hold_action:
                  action: more-info
                double_tap_action:
                  action: none
              - type: custom:mushroom-entity-card
                entity: button.neopool_clear_error_state
                name: Clear Errors
                icon: mdi:brush-variant
                tap_action:
                  action: toggle
                hold_action:
                  action: more-info
                double_tap_action:
                  action: none
          - type: grid
            columns: 3
            square: false
            cards:
              - type: custom:mushroom-select-card
                entity: select.neopool_filtration_mode
                name: Filtr. Mode
                icon: mdi:auto-mode
              - type: custom:mushroom-select-card
                entity: select.neopool_filtration_speed
                name: Filtr. Speed
                icon: si:speedtest
              - type: custom:mushroom-select-card
                entity: select.neopool_boost_mode
                icon: mdi:lightning-bolt-outline
                name: Hydro Boost
          - type: custom:text-divider-row
            text: Setpoints
          - type: grid
            columns: 2
            square: false
            cards:
              - type: custom:mushroom-number-card
                entity: number.neopool_hydrolysis_setpoint
                name: Hydrolysis
                icon: phu:pool-clorine
                layout: horizontal
                display_mode: slider
              - type: custom:mushroom-number-card
                entity: number.neopool_redox_setpoint
                name: Redox
                icon: phu:pool-electric-lvl
                layout: horizontal
                display_mode: slider
              - type: custom:mushroom-number-card
                entity: number.neopool_ph_min
                name: pH Min.
                layout: horizontal
                display_mode: slider
              - type: custom:mushroom-number-card
                entity: number.neopool_ph_max
                name: pH Max.
                layout: horizontal
                display_mode: slider
              # Conditional setpoints — only render when the relevant module is installed
              - type: conditional
                conditions:
                  - entity: binary_sensor.neopool_chlorine_module
                    state: "on"
                card:
                  type: custom:mushroom-number-card
                  entity: number.neopool_chlorine_setpoint
                  name: Chlorine
                  icon: mdi:test-tube
                  layout: horizontal
                  display_mode: slider
              - type: conditional
                conditions:
                  - entity: binary_sensor.neopool_ionization_module
                    state: "on"
                card:
                  type: custom:mushroom-number-card
                  entity: number.neopool_ionization_setpoint
                  name: Ionization
                  icon: mdi:atom
                  layout: horizontal
                  display_mode: slider
          - type: custom:text-divider-row
            text: Configuration
          - type: grid
            columns: 2
            square: false
            cards:
              - type: custom:mushroom-number-card
                entity: number.neopool_ph_pump_activation_delay
                name: pH Pump Delay
                layout: horizontal
                display_mode: slider
              - type: custom:mushroom-number-card
                entity: number.neopool_hydrolysis_cover_reduction
                name: Cover Reduct. %
                layout: horizontal
                display_mode: slider
              - type: custom:mushroom-entity-card
                entity: switch.neopool_hydrolysis_cover_reduction
                name: Cover Reduction
                tap_action:
                  action: toggle
              - type: custom:mushroom-entity-card
                entity: switch.neopool_hydrolysis_temperature_shutdown
                name: Temp Shutdown
                tap_action:
                  action: toggle
              - type: custom:mushroom-entity-card
                entity: switch.neopool_smart_antifreeze
                name: Smart Antifreeze
                tap_action:
                  action: toggle
              - type: custom:mushroom-entity-card
                entity: switch.neopool_auto_time_sync
                name: Auto Time Sync
                tap_action:
                  action: toggle
          # Conditional: Heating knobs — only render when a heating relay is
          # assigned on the controller (the integration disables these
          # entities otherwise, and per the Tasmota driver register map
          # Intelligent mode itself requires the heating function).
          - type: conditional
            conditions:
              - entity: binary_sensor.neopool_relay_heating_state
                state:
                  - "on"
                  - "off"
            card:
              type: custom:stack-in-card
              cards:
                - type: custom:text-divider-row
                  text: Heating
                - type: grid
                  columns: 2
                  square: false
                  cards:
                    - type: custom:mushroom-entity-card
                      entity: switch.neopool_climate_mode
                      name: Climate Mode
                      tap_action:
                        action: toggle
                    - type: custom:mushroom-number-card
                      entity: number.neopool_heating_temperature
                      name: Heating Temp.
                      layout: horizontal
                      display_mode: slider
                    - type: custom:mushroom-number-card
                      entity: number.neopool_intelligent_min_filtration_time
                      name: Int. Min Filt Time
                      layout: horizontal
                      display_mode: slider
      - type: custom:stack-in-card
        cards:
          - type: custom:text-divider-row
            text: Alarms
          - type: grid
            columns: 3
            square: false
            cards:
              - type: custom:mushroom-legacy-template-card
                entity: binary_sensor.neopool_hydrolysis_flow_alarm
                primary: Hydro Flow Alarm
                secondary: >-
                  {{ 'No Flow' if is_state('binary_sensor.neopool_hydrolysis_flow_alarm', 'on') else 'OK' }}
                icon: mdi:waves-arrow-right
                icon_color: >-
                  {{ 'red' if is_state('binary_sensor.neopool_hydrolysis_flow_alarm', 'on') else 'green' }}
                tap_action:
                  action: more-info
              - type: custom:mushroom-legacy-template-card
                entity: binary_sensor.neopool_ph_flow_alarm
                primary: pH Flow Alarm
                secondary: >-
                  {{ 'No Flow' if is_state('binary_sensor.neopool_ph_flow_alarm', 'on') else 'OK' }}
                icon: mdi:pipe-valve
                icon_color: >-
                  {{ 'red' if is_state('binary_sensor.neopool_ph_flow_alarm', 'on') else 'green' }}
                tap_action:
                  action: more-info
              - type: custom:mushroom-legacy-template-card
                entity: binary_sensor.neopool_hydrolysis_low_production
                primary: Low Production
                secondary: >-
                  {{ 'Low' if is_state('binary_sensor.neopool_hydrolysis_low_production', 'on') else 'OK' }}
                icon: mdi:gauge-low
                icon_color: >-
                  {{ 'red' if is_state('binary_sensor.neopool_hydrolysis_low_production', 'on') else 'green' }}
                tap_action:
                  action: more-info
              - type: custom:mushroom-legacy-template-card
                entity: binary_sensor.neopool_ph_tank_level_low
                primary: pH Tank
                secondary: >-
                  {{ 'Low' if is_state('binary_sensor.neopool_ph_tank_level_low', 'on') else 'OK' }}
                icon: mdi:cup-water
                icon_color: >-
                  {{ 'red' if is_state('binary_sensor.neopool_ph_tank_level_low', 'on') else 'green' }}
                tap_action:
                  action: more-info
              - type: custom:mushroom-legacy-template-card
                entity: binary_sensor.neopool_redox_tank_level_low
                primary: Redox Tank
                secondary: >-
                  {{ 'Low' if is_state('binary_sensor.neopool_redox_tank_level_low', 'on') else 'OK' }}
                icon: mdi:cup-water
                icon_color: >-
                  {{ 'red' if is_state('binary_sensor.neopool_redox_tank_level_low', 'on') else 'green' }}
                tap_action:
                  action: more-info
              - type: custom:mushroom-legacy-template-card
                entity: binary_sensor.neopool_connection_problem
                primary: Controller Link
                secondary: >-
                  {{ 'Problem' if is_state('binary_sensor.neopool_connection_problem', 'on') else 'OK' }}
                icon: mdi:cable-data
                icon_color: >-
                  {{ 'red' if is_state('binary_sensor.neopool_connection_problem', 'on') else 'green' }}
                tap_action:
                  action: more-info
          - type: custom:text-divider-row
            text: Hydrolysis Module Info
          - type: grid
            columns: 3
            square: false
            cards:
              - type: custom:mushroom-entity-card
                entity: sensor.neopool_hydrolysis_state
                name: Hydro State
                icon: mdi:water-sync
              - type: custom:mushroom-entity-card
                entity: sensor.neopool_hydrolysis_g_h
                name: Hydro Production
                icon: phu:pool-clorine
              - type: custom:mushroom-entity-card
                entity: sensor.neopool_hydrolysis
                name: Hydro Production %
                icon: phu:pool-clorine
              - type: custom:mushroom-entity-card
                entity: sensor.neopool_hydrolysis_polarity_changes
                name: Polarity Changes
                icon: mdi:swap-horizontal-circle-outline
              - type: custom:mushroom-entity-card
                entity: sensor.neopool_hydrolysis_runtime_total
                name: Tot. Runtime
              - type: custom:mushroom-entity-card
                entity: sensor.neopool_hydrolysis_runtime_pol1
                name: Pol1 Runtime
              - type: custom:mushroom-entity-card
                entity: sensor.neopool_hydrolysis_runtime_pol2
                name: Pol2 Runtime
              - type: custom:mushroom-entity-card
                entity: sensor.neopool_ph_state
                name: pH State
              - type: custom:mushroom-entity-card
                entity: sensor.neopool_ph_pump
                name: pH Pump
                icon: phu:pool-filter
              - type: custom:mushroom-entity-card
                entity: binary_sensor.neopool_hydrolysis_cover
                name: Cover
                icon: mdi:window-shutter-cog
              - type: custom:mushroom-entity-card
                entity: binary_sensor.neopool_hydrolysis_redox_controlled
                name: Redox Ctrl
                icon: mdi:auto-mode
          # Conditional: Chlorine module
          - type: conditional
            conditions:
              - entity: binary_sensor.neopool_chlorine_module
                state: "on"
            card:
              type: custom:stack-in-card
              cards:
                - type: custom:text-divider-row
                  text: Chlorine Module
                - type: grid
                  columns: 2
                  square: false
                  cards:
                    - type: custom:mushroom-entity-card
                      entity: sensor.neopool_chlorine
                      name: Chlorine
                      icon: mdi:test-tube
                    - type: custom:mushroom-entity-card
                      entity: binary_sensor.neopool_relay_chlorine_state
                      name: Relay
                      icon: mdi:electric-switch
          # Conditional: Ionization module
          - type: conditional
            conditions:
              - entity: binary_sensor.neopool_ionization_module
                state: "on"
            card:
              type: custom:stack-in-card
              cards:
                - type: custom:text-divider-row
                  text: Ionization Module
                - type: grid
                  columns: 1
                  square: false
                  cards:
                    - type: custom:mushroom-entity-card
                      entity: sensor.neopool_ionization
                      name: Ionization
                      icon: mdi:atom
          # Conditional: Conductivity module
          - type: conditional
            conditions:
              - entity: binary_sensor.neopool_conductivity_module
                state: "on"
            card:
              type: custom:stack-in-card
              cards:
                - type: custom:text-divider-row
                  text: Conductivity Module
                - type: grid
                  columns: 2
                  square: false
                  cards:
                    - type: custom:mushroom-entity-card
                      entity: sensor.neopool_conductivity
                      name: Conductivity
                      icon: mdi:water-percent
                    - type: custom:mushroom-entity-card
                      entity: binary_sensor.neopool_relay_conductivity_state
                      name: Relay
                      icon: mdi:electric-switch
          - type: custom:text-divider-row
            text: Modules Detected
          - type: grid
            columns: 3
            square: false
            cards:
              - type: custom:mushroom-entity-card
                entity: binary_sensor.neopool_ph_module
                name: pH
              - type: custom:mushroom-entity-card
                entity: binary_sensor.neopool_redox_module
                name: Redox
              - type: custom:mushroom-entity-card
                entity: binary_sensor.neopool_hydrolysis_module
                name: Hydrolysis
              - type: custom:mushroom-entity-card
                entity: binary_sensor.neopool_chlorine_module
                name: Chlorine
              - type: custom:mushroom-entity-card
                entity: binary_sensor.neopool_conductivity_module
                name: Conductivity
              - type: custom:mushroom-entity-card
                entity: binary_sensor.neopool_ionization_module
                name: Ionization
          - type: custom:text-divider-row
            text: Relays State
          - type: grid
            columns: 4
            square: false
            cards:
              - type: custom:mushroom-entity-card
                entity: binary_sensor.neopool_relay_acid_state
                name: Acid
              - type: custom:mushroom-entity-card
                entity: binary_sensor.neopool_relay_base_state
                name: Base
              - type: custom:mushroom-entity-card
                entity: binary_sensor.neopool_relay_redox_state
                name: Redox
              - type: custom:mushroom-entity-card
                entity: binary_sensor.neopool_relay_heating_state
                name: Heating
              - type: custom:mushroom-entity-card
                entity: binary_sensor.neopool_relay_uv_state
                name: UV
              - type: custom:mushroom-entity-card
                entity: binary_sensor.neopool_relay_valve_state
                name: Valve
          - type: custom:text-divider-row
            text: AUX Relays Mode
          - type: grid
            columns: 4
            square: false
            cards:
              - type: custom:mushroom-entity-card
                entity: binary_sensor.neopool_aux1
                name: Aux1 State
                icon: mdi:electric-switch
              - type: custom:mushroom-entity-card
                entity: binary_sensor.neopool_aux2
                name: Aux2 State
                icon: mdi:electric-switch
              - type: custom:mushroom-entity-card
                entity: binary_sensor.neopool_aux3
                name: Aux3 State
                icon: mdi:electric-switch
              - type: custom:mushroom-entity-card
                entity: binary_sensor.neopool_aux4
                name: Aux4 State
                icon: mdi:electric-switch
              - type: custom:mushroom-select-card
                entity: select.neopool_aux1_mode
                name: Aux1 Mode
              - type: custom:mushroom-select-card
                entity: select.neopool_aux2_mode
                name: Aux2 Mode
              - type: custom:mushroom-select-card
                entity: select.neopool_aux3_mode
                name: Aux3 Mode
              - type: custom:mushroom-select-card
                entity: select.neopool_aux4_mode
                name: Aux4 Mode
      - type: custom:stack-in-card
        cards:
          - type: custom:text-divider-row
            text: Timer Schedules
          - type: grid
            columns: 4
            square: false
            cards:
              - type: custom:mushroom-select-card
                entity: select.neopool_filtration_timer_1_mode
                name: Filt 1 Mode
              - type: custom:mushroom-select-card
                entity: select.neopool_filtration_timer_1_speed
                name: Filt 1 Speed
                icon: si:speedtest
              - type: tile
                entity: time.neopool_filtration_timer_1_start
                name: Filt 1 Start
              - type: tile
                entity: time.neopool_filtration_timer_1_stop
                name: Filt 1 Stop
              - type: custom:mushroom-select-card
                entity: select.neopool_filtration_timer_2_mode
                name: Filt 2 Mode
              - type: custom:mushroom-select-card
                entity: select.neopool_filtration_timer_2_speed
                name: Filt 2 Speed
                icon: si:speedtest
              - type: tile
                entity: time.neopool_filtration_timer_2_start
                name: Filt 2 Start
              - type: tile
                entity: time.neopool_filtration_timer_2_stop
                name: Filt 2 Stop
              - type: custom:mushroom-select-card
                entity: select.neopool_filtration_timer_3_mode
                name: Filt 3 Mode
              - type: custom:mushroom-select-card
                entity: select.neopool_filtration_timer_3_speed
                name: Filt 3 Speed
                icon: si:speedtest
              - type: tile
                entity: time.neopool_filtration_timer_3_start
                name: Filt 3 Start
              - type: tile
                entity: time.neopool_filtration_timer_3_stop
                name: Filt 3 Stop
              - type: custom:mushroom-select-card
                entity: select.neopool_light_timer_mode
                name: Light Mode
              - type: tile
                entity: time.neopool_light_timer_start
                name: Light Start
              - type: tile
                entity: time.neopool_light_timer_stop
                name: Light Stop
          - type: custom:text-divider-row
            text: Controller
          - type: grid
            columns: 2
            square: false
            cards:
              - type: custom:mushroom-entity-card
                entity: sensor.neopool_controller_time
                name: Controller Time
                icon: mdi:clock-outline
              - type: custom:mushroom-entity-card
                entity: button.neopool_sync_controller_time
                name: Sync Time
                icon: mdi:clock-check-outline
                tap_action:
                  action: toggle
                hold_action:
                  action: more-info
                double_tap_action:
                  action: none
          - type: custom:text-divider-row
            text: Power Unit Info
          - square: false
            type: grid
            columns: 4
            cards:
              - type: custom:mushroom-entity-card
                entity: sensor.neopool_powerunit_5v
                name: 5V
              - type: custom:mushroom-entity-card
                entity: sensor.neopool_powerunit_12v
                name: 12V
              - type: custom:mushroom-entity-card
                entity: sensor.neopool_powerunit_24_30v
                name: 24V
              - type: custom:mushroom-entity-card
                entity: sensor.neopool_powerunit_4_20ma
                name: 4mA
          - type: custom:text-divider-row
            text: Connection Statistics
          - square: false
            type: grid
            columns: 4
            cards:
              - type: custom:mushroom-entity-card
                entity: sensor.neopool_connection_requests
                name: Requests
              - type: custom:mushroom-entity-card
                entity: sensor.neopool_connection_responses
                name: Responses
              - type: custom:mushroom-entity-card
                entity: sensor.neopool_connection_no_response
                name: Missed
              - type: custom:mushroom-entity-card
                entity: sensor.neopool_connection_out_of_range
                name: Invalid
              - type: custom:mushroom-entity-card
                entity: sensor.neopool_connection_error_rate
                name: Err Rate
                icon: mdi:percent
