# yamllint disable
#
# Sugar Valley NeoPool — full-width Lovelace dashboard (MIGRATED users)
#
# This file is a Lovelace view fragment (pasted under `views:` in a
# dashboard), not a standalone YAML document — yamllint is disabled for
# the whole file because the top-level indentation is intentional.
#
# Companion to the alexdelprete/ha-sugar-valley-neopool custom integration.
# Use this file ONLY IF you migrated from the YAML package
# (HA-NeoPool-MQTT-Package) and your entity IDs are still `neopool_mqtt_*`.
#
# For a fresh install (default device name `NeoPool`), use
# `ha_neopool_lovelace.yaml` instead.
#
# Compared to the upstream package's `ha_neopool_mqtt_lovelace.yaml`, this
# file:
# - drops three relay-state tiles (pH / Filtration / Light) that the
#   integration deletes during migration (the YAML package's assumption of
#   a fixed relay→function mapping was incorrect — see CLAUDE.md and
#   const.py:YAML_ENTITIES_TO_DELETE);
# - adds conditional sections for the chlorine, ionization, and
#   conductivity modules so cards hide when those modules aren't installed;
# - adds tiles for the new entities the integration ships beyond the
#   package (sync controller time button, hydrolysis redox controlled,
#   controller time sensor, extra relay-state binary sensors).

  - icon: mdi:pool
    type: custom:masonry-layout
    layout:
      width: 400
    badges: []
    cards:
      - type: custom:stack-in-card
        cards:
          - type: custom:text-divider-row
            text: Sugar Valley NeoPool
          - type: grid
            square: false
            columns: 3
            cards:
              - type: custom:mushroom-entity-card
                entity: sensor.neopool_mqtt_water_temperature
                primary_info: state
                secondary_info: name
                name: Temperature
                icon_color: blue
              - type: custom:mushroom-entity-card
                entity: sensor.neopool_mqtt_ph_data
                primary_info: state
                secondary_info: name
                name: pH
                icon_color: green
              - type: custom:mushroom-entity-card
                entity: sensor.neopool_mqtt_redox_data
                primary_info: state
                secondary_info: name
                name: Redox
                icon_color: cyan
          - type: custom:mini-graph-card
            entities:
              - entity: sensor.neopool_mqtt_water_temperature
                name: Temperature
                color: var(--blue-color)
              - entity: sensor.neopool_mqtt_ph_data
                name: pH
                color: var(--green-color)
                y_axis: secondary
            hours_to_show: 24
            line_width: 3
            font_size: 50
            animate: true
            show:
              name: false
              icon: false
              state: false
              legend: false
              fill: fade
          - type: custom:mini-graph-card
            entities:
              - entity: sensor.neopool_mqtt_redox_data
                name: Redox
                color: var(--cyan-color)
            hours_to_show: 24
            line_width: 3
            font_size: 50
            animate: true
            show:
              name: false
              icon: false
              state: false
              legend: false
              fill: fade
          - type: custom:text-divider-row
            text: Main Controls
          - type: grid
            columns: 3
            square: false
            cards:
              - type: custom:mushroom-entity-card
                entity: switch.neopool_mqtt_filtration_switch
                icon: phu:pool-filter
                name: Filtration
                tap_action:
                  action: toggle
                hold_action:
                  action: more-info
                double_tap_action:
                  action: none
              - type: custom:mushroom-entity-card
                entity: light.neopool_mqtt_light
                icon: mdi:light-recessed
                name: Light
                tap_action:
                  action: toggle
                hold_action:
                  action: more-info
                double_tap_action:
                  action: none
              - type: custom:mushroom-entity-card
                entity: button.neopool_mqtt_clear_error_state
                name: Clear Errors
                icon: mdi:brush-variant
                tap_action:
                  action: toggle
                hold_action:
                  action: more-info
                double_tap_action:
                  action: none
          - type: grid
            columns: 3
            square: false
            cards:
              - type: custom:mushroom-entity-card
                entity: sensor.neopool_mqtt_filtration_mode
                name: Mode Status
                icon: mdi:auto-mode
              - type: custom:mushroom-entity-card
                entity: sensor.neopool_mqtt_filtration_speed
                name: Speed Status
                icon: si:speedtest
              - type: custom:mushroom-entity-card
                entity: sensor.neopool_mqtt_boost_mode
                name: Boost Status
                icon: mdi:lightning-bolt-outline
          - type: grid
            columns: 3
            square: false
            cards:
              - type: custom:mushroom-select-card
                entity: select.neopool_mqtt_filtration_mode
                name: Filtr. Mode
                icon: mdi:auto-mode
              - type: custom:mushroom-select-card
                entity: select.neopool_mqtt_filtration_speed
                name: Filtr. Speed
                icon: si:speedtest
              - type: custom:mushroom-select-card
                entity: select.neopool_mqtt_boost_mode
                icon: mdi:lightning-bolt-outline
                name: Hydro Boost
          - type: custom:text-divider-row
            text: Setpoints
          - type: grid
            columns: 2
            square: false
            cards:
              - type: custom:mushroom-number-card
                entity: number.neopool_mqtt_hydrolysis_setpoint
                name: Hydrolysis
                icon: phu:pool-clorine
                layout: horizontal
                display_mode: slider
              - type: custom:mushroom-number-card
                entity: number.neopool_mqtt_redox_setpoint
                name: Redox
                icon: phu:pool-electric-lvl
                layout: horizontal
                display_mode: slider
              - type: custom:mushroom-number-card
                entity: number.neopool_mqtt_ph_min
                name: pH Min.
                layout: horizontal
                display_mode: slider
              - type: custom:mushroom-number-card
                entity: number.neopool_mqtt_ph_max
                name: pH Max.
                layout: horizontal
                display_mode: slider
              # Conditional setpoints — only render when the relevant module is installed
              - type: conditional
                conditions:
                  - entity: binary_sensor.neopool_mqtt_chlorine_module
                    state: "on"
                card:
                  type: custom:mushroom-number-card
                  entity: number.neopool_mqtt_chlorine_setpoint
                  name: Chlorine
                  icon: mdi:test-tube
                  layout: horizontal
                  display_mode: slider
              - type: conditional
                conditions:
                  - entity: binary_sensor.neopool_mqtt_ionization_module
                    state: "on"
                card:
                  type: custom:mushroom-number-card
                  entity: number.neopool_mqtt_ionization_setpoint
                  name: Ionization
                  icon: mdi:atom
                  layout: horizontal
                  display_mode: slider
          - type: custom:text-divider-row
            text: Configuration
          - type: grid
            columns: 2
            square: false
            cards:
              - type: custom:mushroom-number-card
                entity: number.neopool_mqtt_ph_pump_activation_delay
                name: pH Pump Delay
                layout: horizontal
                display_mode: slider
              - type: custom:mushroom-number-card
                entity: number.neopool_mqtt_hydrolysis_cover_reduction
                name: Cover Reduct. %
                layout: horizontal
                display_mode: slider
              - type: custom:mushroom-entity-card
                entity: switch.neopool_mqtt_hydrolysis_cover_reduction
                name: Cover Reduction
                tap_action:
                  action: toggle
              - type: custom:mushroom-entity-card
                entity: switch.neopool_mqtt_hydrolysis_temperature_shutdown
                name: Temp Shutdown
                tap_action:
                  action: toggle
              - type: custom:mushroom-number-card
                entity: number.neopool_mqtt_hydrolysis_shutdown_temperature
                name: Shutdown Temp
                layout: horizontal
                display_mode: slider
              - type: custom:mushroom-entity-card
                entity: switch.neopool_mqtt_smart_antifreeze
                name: Smart Antifreeze
                tap_action:
                  action: toggle
              - type: custom:mushroom-entity-card
                entity: switch.neopool_mqtt_auto_time_sync
                name: Auto Time Sync
                tap_action:
                  action: toggle
          # Conditional: Heating knobs — only render when a heating relay is
          # assigned on the controller (the integration disables these
          # entities otherwise, and per the Tasmota driver register map
          # Intelligent mode itself requires the heating function).
          - type: conditional
            conditions:
              - entity: binary_sensor.neopool_mqtt_relay_heating_state
                state:
                  - "on"
                  - "off"
            card:
              type: custom:stack-in-card
              cards:
                - type: custom:text-divider-row
                  text: Heating
                - type: grid
                  columns: 2
                  square: false
                  cards:
                    - type: custom:mushroom-entity-card
                      entity: switch.neopool_mqtt_climate_mode
                      name: Climate Mode
                      tap_action:
                        action: toggle
                    - type: custom:mushroom-number-card
                      entity: number.neopool_mqtt_heating_temperature
                      name: Heating Temp.
                      layout: horizontal
                      display_mode: slider
                    - type: custom:mushroom-number-card
                      entity: number.neopool_mqtt_intelligent_min_filtration_time
                      name: Int. Min Filt Time
                      layout: horizontal
                      display_mode: slider
          # Conditional: UV knob — only render when a UV relay is assigned
          # on the controller (the integration disables uv_mode otherwise).
          - type: conditional
            conditions:
              - entity: binary_sensor.neopool_mqtt_relay_uv_state
                state:
                  - "on"
                  - "off"
            card:
              type: custom:stack-in-card
              cards:
                - type: custom:text-divider-row
                  text: UV
                - type: grid
                  columns: 1
                  square: false
                  cards:
                    - type: custom:mushroom-entity-card
                      entity: switch.neopool_mqtt_uv_mode
                      name: UV Mode
                      tap_action:
                        action: toggle
      - type: custom:stack-in-card
        cards:
          - type: custom:text-divider-row
            text: Alarms
          - type: grid
            columns: 3
            square: false
            cards:
              - type: custom:mushroom-legacy-template-card
                entity: binary_sensor.neopool_mqtt_hydrolysis_fl1
                primary: Hydro Flow Alarm
                secondary: >-
                  {{ 'No Flow' if is_state('binary_sensor.neopool_mqtt_hydrolysis_fl1', 'on') else 'OK' }}
                icon: mdi:waves-arrow-right
                icon_color: >-
                  {{ 'red' if is_state('binary_sensor.neopool_mqtt_hydrolysis_fl1', 'on') else 'green' }}
                tap_action:
                  action: more-info
              - type: custom:mushroom-legacy-template-card
                entity: binary_sensor.neopool_mqtt_ph_fl1
                primary: pH Flow Alarm
                secondary: >-
                  {{ 'No Flow' if is_state('binary_sensor.neopool_mqtt_ph_fl1', 'on') else 'OK' }}
                icon: mdi:pipe-valve
                icon_color: >-
                  {{ 'red' if is_state('binary_sensor.neopool_mqtt_ph_fl1', 'on') else 'green' }}
                tap_action:
                  action: more-info
              - type: custom:mushroom-legacy-template-card
                entity: binary_sensor.neopool_mqtt_hydrolysis_low_production
                primary: Low Production
                secondary: >-
                  {{ 'Low' if is_state('binary_sensor.neopool_mqtt_hydrolysis_low_production', 'on') else 'OK' }}
                icon: mdi:gauge-low
                icon_color: >-
                  {{ 'red' if is_state('binary_sensor.neopool_mqtt_hydrolysis_low_production', 'on') else 'green' }}
                tap_action:
                  action: more-info
              - type: custom:mushroom-legacy-template-card
                entity: binary_sensor.neopool_mqtt_ph_tank_level
                primary: pH Tank
                secondary: >-
                  {{ 'Low' if is_state('binary_sensor.neopool_mqtt_ph_tank_level', 'on') else 'OK' }}
                icon: mdi:cup-water
                icon_color: >-
                  {{ 'red' if is_state('binary_sensor.neopool_mqtt_ph_tank_level', 'on') else 'green' }}
                tap_action:
                  action: more-info
              - type: custom:mushroom-legacy-template-card
                entity: binary_sensor.neopool_mqtt_redox_tank_level_low
                primary: Redox Tank
                secondary: >-
                  {{ 'Low' if is_state('binary_sensor.neopool_mqtt_redox_tank_level_low', 'on') else 'OK' }}
                icon: mdi:cup-water
                icon_color: >-
                  {{ 'red' if is_state('binary_sensor.neopool_mqtt_redox_tank_level_low', 'on') else 'green' }}
                tap_action:
                  action: more-info
              - type: custom:mushroom-legacy-template-card
                entity: binary_sensor.neopool_mqtt_connection_problem
                primary: Controller Link
                secondary: >-
                  {{ 'Problem' if is_state('binary_sensor.neopool_mqtt_connection_problem', 'on') else 'OK' }}
                icon: mdi:cable-data
                icon_color: >-
                  {{ 'red' if is_state('binary_sensor.neopool_mqtt_connection_problem', 'on') else 'green' }}
                tap_action:
                  action: more-info
          - type: custom:text-divider-row
            text: Hydrolysis Module Info
          - type: grid
            columns: 3
            square: false
            cards:
              - type: custom:mushroom-entity-card
                entity: sensor.neopool_mqtt_hydrolysis_state
                name: Hydro State
                icon: mdi:water-sync
              - type: custom:mushroom-entity-card
                entity: sensor.neopool_mqtt_hydrolysis_data_g_h
                name: Hydro Production
                icon: phu:pool-clorine
              - type: custom:mushroom-entity-card
                entity: sensor.neopool_mqtt_hydrolysis_data
                name: Hydro Production %
                icon: phu:pool-clorine
              - type: custom:mushroom-entity-card
                entity: sensor.neopool_mqtt_hydrolysis_setpoint_g_h
                name: Setpoint g/h
                icon: phu:pool-clorine
              - type: custom:mushroom-entity-card
                entity: sensor.neopool_mqtt_hydrolysis_max
                name: Max Prod.
                icon: mdi:gauge
              - type: custom:mushroom-entity-card
                entity: sensor.neopool_mqtt_hydrolysis_unit
                name: Unit
                icon: mdi:counter
              - type: custom:mushroom-entity-card
                entity: sensor.neopool_mqtt_hydrolysis_runtime_polarity_changes
                name: Polarity Changes
                icon: mdi:swap-horizontal-circle-outline
              - type: custom:mushroom-entity-card
                entity: sensor.neopool_mqtt_hydrolysis_runtime_total
                name: Tot. Runtime
              - type: custom:mushroom-entity-card
                entity: sensor.neopool_mqtt_hydrolysis_runtime_part
                name: Part. Runtime
              - type: custom:mushroom-entity-card
                entity: sensor.neopool_mqtt_hydrolysis_runtime_pol1
                name: Pol1 Runtime
              - type: custom:mushroom-entity-card
                entity: sensor.neopool_mqtt_hydrolysis_runtime_pol2
                name: Pol2 Runtime
              - type: custom:mushroom-entity-card
                entity: button.neopool_mqtt_reset_cell_runtime
                name: Reset Runtime
                icon: mdi:restore-alert
                tap_action:
                  action: toggle
                  confirmation:
                    text: Reset the hydrolysis cell runtime counters?
                hold_action:
                  action: more-info
                double_tap_action:
                  action: none
              - type: custom:mushroom-entity-card
                entity: sensor.neopool_mqtt_ph_state
                name: pH State
              - type: custom:mushroom-entity-card
                entity: sensor.neopool_mqtt_ph_pump
                name: pH Pump
                icon: phu:pool-filter
              - type: custom:mushroom-entity-card
                entity: binary_sensor.neopool_mqtt_hydrolysis_cover
                name: Cover
                icon: mdi:window-shutter-cog
              - type: custom:mushroom-entity-card
                entity: binary_sensor.neopool_mqtt_hydrolysis_redox_controlled
                name: Redox Ctrl
                icon: mdi:auto-mode
          # Conditional: Chlorine module
          - type: conditional
            conditions:
              - entity: binary_sensor.neopool_mqtt_chlorine_module
                state: "on"
            card:
              type: custom:stack-in-card
              cards:
                - type: custom:text-divider-row
                  text: Chlorine Module
                - type: grid
                  columns: 2
                  square: false
                  cards:
                    - type: custom:mushroom-entity-card
                      entity: sensor.neopool_mqtt_chlorine
                      name: Chlorine
                      icon: mdi:test-tube
                    - type: custom:mushroom-entity-card
                      entity: binary_sensor.neopool_mqtt_relay_chlorine_state
                      name: Relay
                      icon: mdi:electric-switch
          # Conditional: Ionization module
          - type: conditional
            conditions:
              - entity: binary_sensor.neopool_mqtt_ionization_module
                state: "on"
            card:
              type: custom:stack-in-card
              cards:
                - type: custom:text-divider-row
                  text: Ionization Module
                - type: grid
                  columns: 1
                  square: false
                  cards:
                    - type: custom:mushroom-entity-card
                      entity: sensor.neopool_mqtt_ionization
                      name: Ionization
                      icon: mdi:atom
          # Conditional: Conductivity module
          - type: conditional
            conditions:
              - entity: binary_sensor.neopool_mqtt_conductivity_module
                state: "on"
            card:
              type: custom:stack-in-card
              cards:
                - type: custom:text-divider-row
                  text: Conductivity Module
                - type: grid
                  columns: 2
                  square: false
                  cards:
                    - type: custom:mushroom-entity-card
                      entity: sensor.neopool_mqtt_conductivity
                      name: Conductivity
                      icon: mdi:water-percent
                    - type: custom:mushroom-entity-card
                      entity: binary_sensor.neopool_mqtt_relay_conductivity_state
                      name: Relay
                      icon: mdi:electric-switch
          - type: custom:text-divider-row
            text: Modules Detected
          - type: grid
            columns: 3
            square: false
            cards:
              - type: custom:mushroom-entity-card
                entity: binary_sensor.neopool_mqtt_ph_module
                name: pH
              - type: custom:mushroom-entity-card
                entity: binary_sensor.neopool_mqtt_redox_module
                name: Redox
              - type: custom:mushroom-entity-card
                entity: binary_sensor.neopool_mqtt_hydrolysis_module
                name: Hydrolysis
              - type: custom:mushroom-entity-card
                entity: binary_sensor.neopool_mqtt_chlorine_module
                name: Chlorine
              - type: custom:mushroom-entity-card
                entity: binary_sensor.neopool_mqtt_conductivity_module
                name: Conductivity
              - type: custom:mushroom-entity-card
                entity: binary_sensor.neopool_mqtt_ionization_module
                name: Ionization
          # Relay-state tiles: only Acid is kept from the package layout
          # (pH/Filtration/Light state tiles are removed — the integration
          # deletes those entities during migration because the YAML
          # package's assumed fixed relay→function mapping was wrong).
          # All other relays below are NEW entities added by the integration.
          - type: custom:text-divider-row
            text: Relays State
          - type: grid
            columns: 4
            square: false
            cards:
              - type: custom:mushroom-entity-card
                entity: binary_sensor.neopool_mqtt_relay_acid_state
                name: Acid
              - type: custom:mushroom-entity-card
                entity: binary_sensor.neopool_mqtt_relay_base_state
                name: Base
              - type: custom:mushroom-entity-card
                entity: binary_sensor.neopool_mqtt_relay_redox_state
                name: Redox
              - type: custom:mushroom-entity-card
                entity: binary_sensor.neopool_mqtt_relay_heating_state
                name: Heating
              - type: custom:mushroom-entity-card
                entity: binary_sensor.neopool_mqtt_relay_uv_state
                name: UV
              - type: custom:mushroom-entity-card
                entity: binary_sensor.neopool_mqtt_relay_valve_state
                name: Valve
          - type: custom:text-divider-row
            text: AUX Relays Mode
          - type: grid
            columns: 4
            square: false
            cards:
              - type: custom:mushroom-entity-card
                entity: binary_sensor.neopool_mqtt_aux1
                name: Aux1 State
                icon: mdi:electric-switch
              - type: custom:mushroom-entity-card
                entity: binary_sensor.neopool_mqtt_aux2
                name: Aux2 State
                icon: mdi:electric-switch
              - type: custom:mushroom-entity-card
                entity: binary_sensor.neopool_mqtt_aux3
                name: Aux3 State
                icon: mdi:electric-switch
              - type: custom:mushroom-entity-card
                entity: binary_sensor.neopool_mqtt_aux4
                name: Aux4 State
                icon: mdi:electric-switch
              - type: custom:mushroom-select-card
                entity: select.neopool_mqtt_aux1_mode
                name: Aux1 Mode
              - type: custom:mushroom-select-card
                entity: select.neopool_mqtt_aux2_mode
                name: Aux2 Mode
              - type: custom:mushroom-select-card
                entity: select.neopool_mqtt_aux3_mode
                name: Aux3 Mode
              - type: custom:mushroom-select-card
                entity: select.neopool_mqtt_aux4_mode
                name: Aux4 Mode
      - type: custom:stack-in-card
        cards:
          - type: custom:text-divider-row
            text: Timer Schedules
          - type: grid
            columns: 4
            square: false
            cards:
              - type: custom:mushroom-select-card
                entity: select.neopool_mqtt_filtration_timer_1_mode
                name: Filt 1 Mode
              - type: custom:mushroom-select-card
                entity: select.neopool_mqtt_filtration_timer_1_speed
                name: Filt 1 Speed
                icon: si:speedtest
              - type: tile
                entity: time.neopool_mqtt_filtration_timer_1_start
                name: Filt 1 Start
              - type: tile
                entity: time.neopool_mqtt_filtration_timer_1_stop
                name: Filt 1 Stop
              - type: custom:mushroom-select-card
                entity: select.neopool_mqtt_filtration_timer_2_mode
                name: Filt 2 Mode
              - type: custom:mushroom-select-card
                entity: select.neopool_mqtt_filtration_timer_2_speed
                name: Filt 2 Speed
                icon: si:speedtest
              - type: tile
                entity: time.neopool_mqtt_filtration_timer_2_start
                name: Filt 2 Start
              - type: tile
                entity: time.neopool_mqtt_filtration_timer_2_stop
                name: Filt 2 Stop
              - type: custom:mushroom-select-card
                entity: select.neopool_mqtt_filtration_timer_3_mode
                name: Filt 3 Mode
              - type: custom:mushroom-select-card
                entity: select.neopool_mqtt_filtration_timer_3_speed
                name: Filt 3 Speed
                icon: si:speedtest
              - type: tile
                entity: time.neopool_mqtt_filtration_timer_3_start
                name: Filt 3 Start
              - type: tile
                entity: time.neopool_mqtt_filtration_timer_3_stop
                name: Filt 3 Stop
              - type: custom:mushroom-select-card
                entity: select.neopool_mqtt_light_timer_mode
                name: Light Mode
              - type: tile
                entity: time.neopool_mqtt_light_timer_start
                name: Light Start
              - type: tile
                entity: time.neopool_mqtt_light_timer_stop
                name: Light Stop
          - type: custom:text-divider-row
            text: Controller
          - type: grid
            columns: 2
            square: false
            cards:
              - type: custom:mushroom-entity-card
                entity: sensor.neopool_mqtt_controller_time
                name: Controller Time
                icon: mdi:clock-outline
              - type: custom:mushroom-entity-card
                entity: button.neopool_mqtt_sync_controller_time
                name: Sync Time
                icon: mdi:clock-check-outline
                tap_action:
                  action: toggle
                hold_action:
                  action: more-info
                double_tap_action:
                  action: none
              - type: custom:mushroom-entity-card
                entity: sensor.neopool_mqtt_system_model
                name: Model
              - type: custom:mushroom-entity-card
                entity: sensor.neopool_mqtt_system_id
                name: System ID
          - type: custom:text-divider-row
            text: Power Unit Info
          - square: false
            type: grid
            columns: 4
            cards:
              - type: custom:mushroom-entity-card
                entity: sensor.neopool_mqtt_powerunit_5v
                name: 5V
              - type: custom:mushroom-entity-card
                entity: sensor.neopool_mqtt_powerunit_12v
                name: 12V
              - type: custom:mushroom-entity-card
                entity: sensor.neopool_mqtt_powerunit_24_30v
                name: 24V
              - type: custom:mushroom-entity-card
                entity: sensor.neopool_mqtt_powerunit_4_20ma
                name: 4mA
              - type: custom:mushroom-entity-card
                entity: sensor.neopool_mqtt_powerunit_version
                name: Version
          - type: custom:text-divider-row
            text: Connection Statistics
